[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flytekitplugins-anakin"
dynamic = ["version"]
description = "Flyte tasks for Anakin: scrape, crawl, search, Wire site actions, website monitors and AI browser tasks"
license = { text = "Apache-2.0" }
authors = [{ name = "Anakin", email = "support@anakin.io" }]
keywords = ["flyte", "flytekit", "flytekitplugins", "anakin", "web-scraping", "crawler", "web-data"]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    # 1.14 added native Pydantic v2 task I/O, which the tasks' outputs rely on.
    "flytekit>=1.14.0,<2.0.0",
    "anakin-sdk>=0.2.0,<0.3.0",
    # Only browser_task calls the API directly (POST /ai/evaluate isn't in
    # anakin-sdk yet); same floor anakin-sdk pins.
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://anakin.io"
Documentation = "https://anakin.io/docs/integrations/workflow/flyte"
Repository = "https://github.com/Anakin-Inc/flytekitplugins-anakin"
Issues = "https://github.com/Anakin-Inc/flytekitplugins-anakin/issues"
Changelog = "https://github.com/Anakin-Inc/flytekitplugins-anakin/blob/main/CHANGELOG.md"

# No `flytekit.plugins` entry point: that hook is for plugins that register a
# type transformer or backend at import time. These tasks are imported
# explicitly, like any other task.

[dependency-groups]
test = [
    "pytest>=8.0.0,<9.0.0",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.10.0,<2.0.0",
]

[tool.hatch.version]
path = "flytekitplugins/anakin/_version.py"

# `flytekitplugins` is a PEP 420 namespace package shared with every other
# flytekit plugin: no __init__.py at that level.
[tool.hatch.build.targets.wheel]
packages = ["flytekitplugins"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/SUBMIT.md"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
# Task signatures use typing.Optional, as in flytekit's own docs and plugins.
extend-ignore = ["UP007", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["flytekitplugins"]
known-third-party = ["anakin"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"

[tool.mypy]
disallow_untyped_defs = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["flytekit", "flytekit.*"]
follow_untyped_imports = true
